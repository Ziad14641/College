<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملفات الكلية | BIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --tx: #14213d;
  --mu: #5c6b8a;
  --ac: #1b365d;
  --ac-light: #e6eef8;
  --ac-hover: #122542;
  --bd: #dce4f0;
  --ok: #0f766e;
  --ok-bg: rgba(15, 118, 110, 0.12);
  --star: #d97706;
  --star-bg: rgba(217, 119, 6, 0.12);
  --shadow: 0 4px 20px -2px rgba(20, 33, 61, 0.06);
  --shadow-hover: 0 10px 25px -5px rgba(27, 54, 93, 0.16);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1320;
    --card: #132035;
    --tx: #f1f5f9;
    --mu: #94a3b8;
    --ac: #60a5fa;
    --ac-light: rgba(96, 165, 250, 0.14);
    --ac-hover: #93c5fd;
    --bd: #223554;
    --ok: #2dd4bf;
    --ok-bg: rgba(45, 212, 191, 0.14);
    --star: #fbbf24;
    --star-bg: rgba(251, 191, 36, 0.14);
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
    --shadow-hover: 0 10px 25px -5px rgba(96, 165, 250, 0.2);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--tx);
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

.hero {
  background: linear-gradient(135deg, #0f2342 0%, #1b365d 55%, #24477a 100%);
  color: #fff;
  padding: 34px 20px 48px;
  text-align: center;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
  box-shadow: 0 10px 30px -10px rgba(15, 35, 66, 0.45);
}

.hero h1 {
  font-size: 1.85rem;
  font-weight: 800;
  margin-bottom: 6px;
}

.hero p {
  font-size: 0.96rem;
  opacity: 0.92;
  max-width: 540px;
  margin: 0 auto 14px;
}

.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #fff;
  padding: 8px 16px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.86rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.share-btn:hover {
  background: rgba(255, 255, 255, 0.24);
  transform: translateY(-1px);
}

main {
  max-width: 860px;
  margin: -26px auto 0;
  padding: 0 16px 56px;
}

.controls-top {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.search-wrap {
  position: relative;
  flex: 1 1 280px;
}

.search-input {
  width: 100%;
  padding: 13px 44px 13px 38px;
  border-radius: 16px;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  font-family: inherit;
  font-size: 0.96rem;
  box-shadow: var(--shadow);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-input:focus {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.15);
}

.search-icon {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mu);
  pointer-events: none;
}

.clear-btn {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: var(--mu);
  font-size: 1rem;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
  display: none;
}

.clear-btn.show { display: block; }
.clear-btn:hover { color: var(--tx); background: var(--ac-light); }

.sort-select {
  padding: 13px 14px;
  border-radius: 16px;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  box-shadow: var(--shadow);
  outline: none;
  cursor: pointer;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 12px;
  margin-bottom: 10px;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 700;
  transition: all 0.2s ease;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
}

.tab:hover {
  border-color: var(--ac);
  transform: translateY(-1px);
}
